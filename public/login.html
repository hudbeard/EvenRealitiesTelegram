<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fieldline · Sign In</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 420px;
      width: 100%;
      background: #1a1a1a;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #fff;
    }
    .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .method-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 1px solid #333;
    }
    .method-tab {
      padding: 12px 20px;
      min-height: 48px;
      width: auto;
      background: none;
      border: none;
      color: #888;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .method-tab:hover { color: #fff; }
    .method-tab.active {
      color: #fff;
      border-bottom-color: #0070a8;
    }
    .method-content {
      display: none;
    }
    .method-content.active {
      display: block;
    }
    .qr-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 24px;
      background: #fff;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .qr-instructions {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-top: 8px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #aaa;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      min-height: 48px;
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
    }
    input:focus {
      border-color: #0070a8;
    }
    button {
      width: 100%;
      padding: 12px 16px;
      min-height: 48px;
      background: #0070a8;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #005f8a; }
    button:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
    }
    .status {
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-top: 16px;
      text-align: center;
    }
    .status.success {
      background: #0d4d20;
      color: #4ade80;
    }
    .status.error {
      background: #4d0d0d;
      color: #f87171;
    }
    .status.info {
      background: #0d2b4d;
      color: #60a5fa;
    }
    .hidden { display: none !important; }
    .countdown {
      font-size: 12px;
      color: #666;
      margin-top: 8px;
      text-align: center;
    }
    .demo-simulate {
      margin-top: 12px;
      background: #2a2a2a;
      padding: 8px;
      border-radius: 6px;
      text-align: center;
      font-size: 12px;
      color: #a0a0a0;
    }
    .link-button {
      background: none;
      color: #60a5fa;
      text-decoration: underline;
      margin-top: 8px;
      min-height: 48px;
    }
    .link-button:hover { background: none; color: #93c5fd; }
    #qr-image img { display: block; width: 240px; height: 240px; }
    .done-link {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 12px;
      padding: 12px;
      min-height: 48px;
      color: #60a5fa;
      text-align: center;
    }
    .demo-simulate button {
      margin-top: 8px;
      padding: 12px 16px;
      min-height: 48px;
      font-size: 12px;
      background: #0d4d20;
    }
    .method-tab:focus-visible,
    input:focus-visible,
    button:focus-visible,
    .link-button:focus-visible,
    .done-link:focus-visible {
      outline: 2px solid #7ec8e8;
      outline-offset: 2px;
      box-shadow: 0 0 0 2px #0a0a0a, 0 0 0 6px #7ec8e8;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Sign in to Telegram</h1>
    <p class="subtitle">Connect your account to Fieldline. The session stays on your server.</p>

    <div class="method-tabs" role="tablist">
      <button type="button" class="method-tab active" data-method="qr" role="tab">QR Code</button>
      <button type="button" class="method-tab" data-method="phone" role="tab">Phone Number</button>
    </div>

    <section id="qr-panel" class="hidden" aria-live="polite">
      <div class="qr-container">
        <div id="qr-image"></div>
        <div class="qr-instructions">
          Scan with Telegram on your phone:<br>
          Settings → Devices → Link Desktop Device
        </div>
        <div class="countdown" id="qr-countdown"></div>
      </div>
      <div id="qr-demo" class="demo-simulate hidden">
        <div>Demo mode: the QR scans itself in about 3 seconds.</div>
        <button type="button" id="simulate-scan">Simulate the scan now</button>
      </div>
    </section>

    <form id="phone-form" class="hidden">
      <div class="form-group">
        <label for="phone-number">Phone number with country code</label>
        <input type="tel" id="phone-number" autocomplete="tel" placeholder="+15551234567">
      </div>
      <button type="submit">Send code</button>
    </form>

    <form id="code-form" class="hidden">
      <div class="form-group">
        <label for="phone-code">Code from Telegram</label>
        <input type="text" id="phone-code" inputmode="numeric" autocomplete="one-time-code" placeholder="12345">
      </div>
      <button type="submit">Verify</button>
    </form>

    <form id="password-form" class="hidden">
      <div class="form-group">
        <label for="password">Two-step verification password</label>
        <input type="password" id="password" autocomplete="current-password">
        <div class="countdown" id="password-hint"></div>
      </div>
      <button type="submit">Confirm password</button>
    </form>

    <div id="status" class="status hidden" role="status"></div>
    <a id="done-link" class="done-link hidden" href="/glasses.html">Open the glasses mirror and pair your display</a>
    <button type="button" id="retry" class="hidden">Try again</button>
    <button type="button" id="cancel" class="link-button hidden">Cancel sign-in</button>
  </main>

  <script>
    const POLL_MS = window.FIELDLINE_LOGIN_POLL_MS ?? 1500;
    const TERMINAL = ["done", "error", "cancelled"];
    const $ = (id) => document.getElementById(id);
    let method = "qr";
    let attempt = null; // latest LoginView from the server
    let generation = 0; // bumps on every start/switch; stale polls are ignored
    let pollTimer, countdownTimer, shownQrVersion = -1;
    let demoMode = false;
    function connectingStatus() {
      status(
        demoMode
          ? "Demo mode, no Telegram connection."
          : "Connecting to Telegram…",
        "info",
      );
    }

    function stopTimers() {
      clearTimeout(pollTimer);
      clearInterval(countdownTimer);
      pollTimer = countdownTimer = undefined;
    }
    async function api(method, path, body) {
      const r = await fetch("/api" + path, {
        method,
        headers: body === undefined ? {} : { "content-type": "application/json" },
        body: body === undefined ? undefined : JSON.stringify(body),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error ?? "Request failed. Try again.");
      return data;
    }
    function status(text, kind) {
      const el = $("status");
      el.textContent = text;
      el.className = "status " + kind;
      el.classList.toggle("hidden", !text);
    }
    function only(...ids) {
      for (const id of ["qr-panel", "phone-form", "code-form", "password-form", "done-link", "retry", "cancel"])
        $(id).classList.toggle("hidden", !ids.includes(id));
    }
    function showQr(view) {
      if (view.qr && view.qrVersion !== shownQrVersion) {
        const img = document.createElement("img");
        img.alt = "Telegram sign-in QR code";
        img.width = 240;
        img.height = 240;
        img.src = view.qr;
        $("qr-image").replaceChildren(img);
        shownQrVersion = view.qrVersion;
        clearInterval(countdownTimer);
        const end = Date.now() + (view.expiresIn ?? 0) * 1000;
        const tick = () => {
          const left = Math.max(0, Math.round((end - Date.now()) / 1000));
          $("qr-countdown").textContent = left
            ? `New code in ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`
            : "Getting a fresh code…";
        };
        tick();
        countdownTimer = setInterval(tick, 1000);
      }
      $("qr-demo").classList.toggle("hidden", !view.demo);
    }
    function render(view) {
      attempt = view;
      const err = view.error?.message ?? "";
      // Signed in: the QR / Phone choice is moot, so hide it.
      document.querySelector(".method-tabs").classList.toggle("hidden", view.state === "done");
      switch (view.state) {
        case "idle":
        case "connecting":
          only("cancel");
          demoMode = !!view.demo;
          connectingStatus();
          break;
        case "qr":
          only("qr-panel", "cancel");
          showQr(view);
          status("", "info");
          break;
        case "awaiting_code":
          only("code-form", "cancel");
          status(
            err ||
              (view.demo
                ? "Demo mode: enter any 5-digit code."
                : "Telegram sent you a code."),
            err ? "error" : "info",
          );
          break;
        case "awaiting_password":
          only("password-form", "cancel");
          $("password-hint").textContent = view.hint ? "Hint: " + view.hint : "";
          status(err || "Two-step verification is on.", err ? "error" : "info");
          break;
        case "saving":
          only();
          status("Signing in…", "info");
          break;
        case "done":
          only("done-link");
          // The synthetic demo display pairs itself on boot (no code to approve).
          $("done-link").textContent = view.demo
            ? "Open your glasses"
            : "Open the glasses mirror and pair your display";
          status(
            "Signed in as " + (view.user?.name ?? "your account") + ". " +
              (view.pickedUp ? "Your server is using this account now." : "Saved. Restart the server to use it."),
            "success",
          );
          break;
        case "cancelled":
          only("retry");
          status("Sign-in cancelled.", "info");
          break;
        default:
          only("retry");
          status(err || "Sign-in failed.", "error");
      }
      if (TERMINAL.includes(view.state)) stopTimers();
      if (view.state !== "qr") clearInterval(countdownTimer);
    }
    function poll(gen) {
      clearTimeout(pollTimer);
      pollTimer = setTimeout(async () => {
        if (gen !== generation || !attempt || TERMINAL.includes(attempt.state)) return;
        try {
          const view = await api("GET", "/login/" + attempt.id);
          if (gen !== generation) return;
          render(view);
          if (!TERMINAL.includes(view.state)) poll(gen);
        } catch (e) {
          if (gen !== generation) return;
          stopTimers();
          only("retry");
          status(e.message, "error");
        }
      }, POLL_MS);
    }
    async function cancelCurrent() {
      const current = attempt;
      attempt = null;
      if (current && !TERMINAL.includes(current.state))
        await api("POST", `/login/${current.id}/cancel`, {}).catch(() => {});
    }
    async function begin(kind, phone, explicit) {
      stopTimers();
      const gen = ++generation;
      shownQrVersion = -1;
      $("qr-image").replaceChildren();
      await cancelCurrent();
      only("cancel");
      connectingStatus();
      try {
        const body = kind === "phone" ? { phone } : explicit ? { explicit: true } : {};
        const view = await api("POST", `/login/${kind}/start`, body);
        if (gen !== generation) return;
        render(view);
        if (!TERMINAL.includes(view.state)) poll(gen);
      } catch (e) {
        if (gen !== generation) return;
        only("retry");
        status(e.message, "error");
      }
    }
    async function submit(path, body, form) {
      if (!attempt) return;
      const button = form.querySelector("button");
      button.disabled = true;
      const gen = generation;
      try {
        const view = await api("POST", `/login/${attempt.id}/${path}`, body);
        if (gen === generation) render(view);
      } catch (e) {
        status(e.message, "error");
      } finally {
        button.disabled = false;
      }
    }
    async function switchMethod(next) {
      method = next;
      document.querySelectorAll(".method-tab").forEach((t) => t.classList.toggle("active", t.dataset.method === next));
      if (next === "qr") return begin("qr", undefined, true);
      stopTimers();
      generation++;
      await cancelCurrent();
      only("phone-form");
      status("", "info");
    }

    document.querySelectorAll(".method-tab").forEach((tab) => tab.addEventListener("click", () => switchMethod(tab.dataset.method)));
    $("phone-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const phone = $("phone-number").value.trim();
      if (!phone) return status("Enter your phone number.", "error");
      begin("phone", phone);
    });
    $("code-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const code = $("phone-code").value.trim();
      if (!code) return status("Enter the code.", "error");
      $("phone-code").value = "";
      submit("code", { code }, e.target);
    });
    $("password-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const password = $("password").value;
      if (!password) return status("Enter your password.", "error");
      $("password").value = "";
      submit("password", { password }, e.target);
    });
    $("simulate-scan").addEventListener("click", async () => {
      if (!attempt) return;
      try {
        render(await api("POST", `/login/${attempt.id}/simulate-scan`, {}));
      } catch (e) {
        status(e.message, "error");
      }
    });
    $("cancel").addEventListener("click", async () => {
      const current = attempt;
      stopTimers();
      generation++;
      if (!current) return;
      try {
        render(await api("POST", `/login/${current.id}/cancel`, {}));
      } catch (e) {
        status(e.message, "error");
      }
    });
    $("retry").addEventListener("click", () => (method === "qr" ? begin("qr", undefined, true) : switchMethod("phone")));
    window.addEventListener("pagehide", stopTimers);
    (async () => {
      try {
        const health = await api("GET", "/health");
        demoMode = health.synthetic === true || health.mode === "personal-demo";
      } catch {}
      begin("qr");
    })();
  </script>
</body>
</html>
